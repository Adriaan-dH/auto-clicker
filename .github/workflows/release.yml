name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PulseClicker-Windows-x64.exe
          - os: ubuntu-22.04
            asset: PulseClicker-Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libxkbcommon-x11-0
      - run: python -m pip install -r requirements-dev.txt
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Windows UI smoke test
        if: runner.os == 'Windows'
        run: python main.py --smoke-test
      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python main.py --smoke-test
      - run: python scripts/build.py
      - name: Windows executable smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/PulseClicker.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
      - name: Linux executable smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/PulseClicker --smoke-test
      - name: Prepare release asset and checksum
        shell: python
        run: |
          import hashlib, pathlib, shutil
          source = pathlib.Path('dist/PulseClicker' + ('.exe' if '${{ runner.os }}' == 'Windows' else ''))
          target = source.with_name('${{ matrix.asset }}')
          shutil.copy2(source, target)
          target.with_name(target.name + '.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Pulse Clicker $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
